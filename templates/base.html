{% load static %}
<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kararsızım{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container" aria-label="Ana navigasyon">
            <a class="brand" href="{% url 'home' %}">Kararsızım <span aria-hidden="true">🤔</span></a>
            <div class="nav-actions">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="#">@{{ user.username }}</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="nav-link nav-button" type="submit">Çıkış</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Giriş Yap</a>
                    <a class="button button-small" href="{% url 'signup' %}">Üye Ol</a>
                {% endif %}
            </div>
        </nav>
    </header>
    {% include "partials/messages.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
