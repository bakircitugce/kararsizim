{% if messages %}
<div class="messages container" aria-live="polite">
    {% for message in messages %}
    <div class="message message-{{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" class="message-close" aria-label="Mesajı kapat">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
